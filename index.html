<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forge Studio</title><link rel="stylesheet" href="css/app.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><div id="app">
<div id="menubar"><b class="brand">FORGE</b><span id="menus"></span><span id="pname"></span><span class="sp"></span><span id="save">Saved locally</span></div>
<div id="toolbar"><button id="mE" class="mob">Scene</button><button data-t="select" title="Select (Q)">Select</button><button data-t="translate" class="on" title="Move (W)">Move</button><button data-t="rotate" title="Rotate (E)">Rotate</button><button data-t="scale" title="Scale (R)">Scale</button><button id="space" title="Local / World">World</button><select id="snap" title="Snap"><option value="0">Snap: off</option><option value="0.25">0.25</option><option value="0.5">0.5</option><option value="1">1</option></select><i class="sep"></i><button id="bundo">Undo</button><button id="bredo">Redo</button><i class="sep"></i><button id="run">▶ Run</button><button id="stop">■ Stop</button><span class="sp"></span><button id="mI" class="mob">Inspector</button></div>
<div id="body"><aside id="explorer"><div class="ph">Hierarchy<input id="q" placeholder="Search"></div><div id="tree"></div></aside><div class="rz" id="rzL"></div>
<main id="center"><div id="vtabs"><button data-v="scene" class="on">Scene</button><button data-v="code">Code</button><button data-v="preview">Preview</button></div><div id="views"><div id="scene" class="view"></div><div id="code" class="view" hidden><div id="ftree"><div class="ph">Files<span><button id="fnew">New</button><button id="fren">Rename</button><button id="fdel">Delete</button></span></div><input id="fsearch" placeholder="Search files (Enter)"><div id="flist"></div></div><div id="cedit"><div id="ctabs"></div><div id="monaco"></div></div></div><div id="preview" class="view" hidden><iframe id="pframe" sandbox="allow-scripts allow-modals allow-pointer-lock" title="Game preview"></iframe></div></div></main><div class="rz" id="rzR"></div><aside id="inspector"><div class="ph">Inspector</div><div id="insp"></div></aside></div>
<div class="rzh" id="rzB"></div><section id="bottom"><div class="ph">Console<span><select id="lvl"><option value="info">All</option><option value="warn">Warnings+</option><option value="error">Errors</option></select><button id="clr">Clear</button></span></div><div id="log"></div></section></div><script type="module" src="js/main.js"></script></body></html>
